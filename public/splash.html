<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <link rel="preload" href="/PsDesign_icon.png" as="image" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: "Hiragino Kaku Gothic ProN", "Hiragino Kaku Gothic Pro", "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      background: #212121;
    }
    .splash {
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 36px;
      background: #212121;
      border-radius: 8px;
      color: #ffffff;
    }
    .brand-pane {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 24px;
      min-width: 0;
    }
    .brand-icon {
      width: 84px;
      height: 84px;
      object-fit: contain;
      opacity: 0;
      transform: translateY(8px) scale(0.985);
      transition:
        opacity 1.6s ease,
        transform 1.6s cubic-bezier(0.22, 1, 0.36, 1);
      will-change: opacity, transform;
      user-select: none;
      -webkit-user-drag: none;
    }
    .brand-name {
      margin: 0;
      line-height: 1;
    }
    .home-title-word {
      display: block;
      padding-left: 0.64em;
      opacity: 0;
      color: #ffffff;
      font-family: "Cinzel", "Times New Roman", serif;
      font-size: 58px;
      font-weight: 600;
      letter-spacing: 0.64em;
      line-height: 1;
      text-shadow: 0 12px 24px rgba(0, 0, 0, 0.52);
      transform: translateY(8px) scale(0.985);
      transition:
        opacity 1.6s 0.08s ease,
        transform 1.6s 0.08s cubic-bezier(0.22, 1, 0.36, 1);
      will-change: opacity, transform;
      user-select: none;
      -webkit-user-drag: none;
    }
    .progress-pane {
      display: none;
    }
    .splash.is-ready .brand-icon,
    .splash.is-ready .home-title-word {
      opacity: 1;
      transform: translateY(0) scale(1);
    }
    @media (prefers-reduced-motion: reduce) {
      .brand-icon,
      .home-title-word {
        transition: none;
        opacity: 1;
        transform: none;
      }
    }
  </style>
</head>
<body>
  <div class="splash" data-tauri-drag-region>
    <div class="brand-pane" data-tauri-drag-region>
      <img class="brand-icon" src="/PsDesign_icon.png" alt="OPUS" draggable="false" />
      <h1 class="brand-name" data-tauri-drag-region>
        <span class="home-title-word">OPUS</span>
      </h1>
    </div>
  </div>
  <script>
    let current = 0;

    const setProgress = (value) => {
      current = Math.max(0, Math.min(100, Number(value) || 0));
    };

    let timer = setInterval(() => {
      setProgress(Math.min(55, current + Math.random() * 4 + 1));
      if (current >= 55) clearInterval(timer);
    }, 120);

    window.__splashSetProgress = (value) => {
      clearInterval(timer);
      setProgress(value);
    };
  </script>
</body>
</html>
