[package]
name = "opus"
version = "2.6.7"
description = "PSD spread editor with Photoshop apply-back, text extraction, and auto-placement"
edition = "2021"
rust-version = "1.77"

[lib]
name = "psdesign_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
ttf-parser = "0.21"
image = "0.25"
pdfium-render = "0.8"
dirs = "5"
base64 = "0.22"
getrandom = "0.2"
# 参照アドレス割符復号（COMIC-Bridge と共用の addresses.enc を AES-256-GCM で復号）
aes-gcm = "0.10"
sha2 = "0.10"
# ドライブ式自動更新（App_installer\OPUS\ の setup.exe を minisign 検証）
minisign-verify = "0.2"

[target.'cfg(windows)'.dependencies]
winreg = "0.52"
winapi = { version = "0.3", features = ["fileapi", "handleapi", "sysinfoapi", "tlhelp32", "winuser"] }

[profile.dev.package.pdfium-render]
opt-level = 3

[profile.dev.package.image]
opt-level = 3

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
